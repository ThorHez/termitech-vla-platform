[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "termitech-vla-platform"
version = "0.1.0"
description = "Local-data VLA training control plane and bare-metal agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "nvidia-ml-py>=12,<14",
  "paramiko>=3.5,<5",
  "cryptography>=44,<48",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
vla-api = "vla_control.main:main"
vla-scheduler = "vla_control.scheduler:main"
vla-agent = "vla_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["apps/control_plane/vla_control", "apps/agent/vla_agent", "packages/protocol/vla_protocol", "packages/adapters/vla_adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

